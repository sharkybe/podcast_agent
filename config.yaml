# Single config for the podcast skill. One section per step.

paths:
  artifacts_dir: artifacts          # per-show outputs go to artifacts/<show-slug>/

discover:                           # step 1
  search_country: US                # iTunes Search storefront
  max_candidates: 5
  match_spotify_episodes: true      # scrape the Spotify show page and link episodes by title/number

transcribe:                         # step 2
  providers: [spotify, ivrit]       # tried in order: ivrit (local Whisper) only runs for episodes Spotify has no transcript for
  retry_unavailable: false          # re-try episodes already marked "unavailable"
  limit: null                       # max episodes per run (null = all)
  ivrit:                            # local transcription; needs `pip install -r requirements-ivrit.txt`
    model: ivrit-ai/whisper-large-v3-turbo-ct2   # downloaded from Hugging Face on first use (~1.5 GB)
    device: auto                    # faster-whisper has no Apple GPU support: runs on the CPU on a Mac
    compute_type: int8
    language: he
    beam_size: 5
    keep_audio: false               # true = keep the MP3 in artifacts/<show>/audio/

index:                              # step 3 (needs the OpenAI key in the environment)
  embedding_model: text-embedding-3-large   # text-embedding-3-small: cheaper, for testing
  dimensions: null                  # null = native size (3072 large / 1536 small); e.g. 1024 to shrink the index
  api_key_env: OPEN_AI_API_KEY      # variable holding the key: set in the environment or in .env (gitignored)
  chunk_tokens: 400                 # target chunk size, built from whole speaker turns
  overlap_tokens: 80                # tail of the previous chunk repeated at the start of the next
  batch_size: 96                    # texts per embeddings request
  top_chunks: 30                    # passages retrieved per search, then grouped by episode
  min_score: null                   # drop weaker passages (cosine similarity); null = keep all

ask:                                # free answer path (`ask`), no Claude needed; embeddings use the index settings above
  llm_provider: gemini
  llm_model: gemini-3.5-flash-lite  # pick one of free_models below (or any other Gemini model id)
  free_models:                      # Gemini models with a free tier (AI Studio pricing page, checked 2026-11-26)
    - gemini-3.8-flash              # strongest Flash; often busy (503) on the free tier
    - gemini-3.6-flash              # previous Flash generation; a middle option
    - gemini-3.5-flash-lite         # default: fast, worked in testing
    - gemini-3.1-flash-lite         # older, weaker
    - gemini-3-flash-preview        # legacy
    - gemini-2.5-pro                # listed as free, but 2.5 models returned "not available to new users" for our key
    - gemini-2.5-flash              # same
    - gemini-2.5-flash-lite         # same
  llm_api_key_env: GEMINI_API_KEY   # free key from https://aistudio.google.com/apikey, in .env (gitignored)
  temperature: 0.2
  timeout_seconds: 60               # per Gemini call; then it falls back to the episode list
  retries: 2                        # extra tries on 429/5xx ("high demand")
  queries: 3                        # Hebrew search queries written from the question
  top_per_query: 20                 # passages retrieved per query, then merged
  context_chunks: 10                # best merged passages sent to the model
  neighbours: true                  # send each passage together with the chunk after it
  max_context_chars: 24000          # cap on passage text sent to the model (~8k tokens)
  fallback_episodes: 5              # episodes listed when the model is unavailable
  expand_thinking_budget: null      # token budget for thinking in the query step (null = model default)
  answer_max_tokens: 4096           # includes Gemini's thinking tokens

server:                             # hosted answer API (`serve`, Render): limits reset at midnight Israel time
  data_dir: null                    # show folder (episodes.csv, show.json, index/); env PODCAST_DATA_DIR wins; null = the only show in artifacts/
  index_file: null                  # file in <data_dir>/index/; null = the smallest one (the compact copy)
  questions_per_day: 10             # per user (random id in a cookie)
  follow_ups_per_question: 1
  questions_per_ip_per_day: 30      # so clearing cookies doesn't give unlimited questions
  answers_per_day: 300              # Gemini answers for the whole service; past it, episode lists only
  max_question_chars: 300
  timezone: Asia/Jerusalem
  count_cached: true                # a repeated (cached) question still counts for the user, but costs no Gemini call
  trust_proxy: true                 # client IP from X-Forwarded-For (set by Render)
  cookie_name: pa_uid
  keep_days: 3                      # counters and follow-up history kept this long
  skill_url: https://github.com/sharkybe/podcast_agent#readme   # "use the skill" link for Claude Pro users

display:
  fix_rtl: true                     # reorder Hebrew for terminals without right-to-left support (VS Code); terminal only, never JSON/files

browser:                            # Playwright (Spotify)
  user_data_dir: .browser_profile   # persistent profile: log in to Spotify once, stays logged in
  channel: chrome
  headless: false
  slow_mo: 100
  start_maximized: true
  viewport:
    width: 1600
    height: 1000
